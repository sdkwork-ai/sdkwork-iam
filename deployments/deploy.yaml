version: 2
defaultProfile: cloud.production
profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: iam-test.sdkwork.com
        tls: sdkwork.com
        mode: api
        web: adaptive
      - domain: iam-test.birdcoder.com
        tls: birdcoder.com
        mode: api
        web: adaptive
      - domain: iam-test.dtupay.com
        tls: dtupay.com
        mode: api
        web: adaptive
      - domain: iam-test.sdkwork.cn
        tls: sdkwork.cn
        mode: api
        web: adaptive
      - domain: iam-test.birdcoder.cn
        tls: birdcoder.cn
        mode: api
        web: adaptive
      - domain: iam-test.dtupay.cn
        tls: dtupay.cn
        mode: api
        web: adaptive
      - domain: iam-test.skubc.com
        tls: skubc.com
        mode: api
        web: adaptive
      - domain: iam-test.skubc.cn
        tls: skubc.cn
        mode: api
        web: adaptive
      - domain: iam-test.zowalk.com
        tls: zowalk.com
        mode: api
        web: adaptive
      - domain: iam-test.zowalk.cn
        tls: zowalk.cn
        mode: api
        web: adaptive
      - domain: iam-test.offer86.com
        tls: offer86.com
        mode: api
        web: adaptive
      - domain: iam-test.offer86.cn
        tls: offer86.cn
        mode: api
        web: adaptive
      - domain: iam-test.86offer.com
        tls: 86offer.com
        mode: api
        web: adaptive
      - domain: iam-test.86offer.cn
        tls: 86offer.cn
        mode: api
        web: adaptive
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env
      kubernetes:
        reference: deployments/kubernetes/
  cloud.staging:
    deployment:
      deploymentProfile: cloud
      environment: staging
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: iam-staging.sdkwork.com
        tls: sdkwork.com
        mode: api
        web: adaptive
      - domain: iam-staging.birdcoder.com
        tls: birdcoder.com
        mode: api
        web: adaptive
      - domain: iam-staging.dtupay.com
        tls: dtupay.com
        mode: api
        web: adaptive
      - domain: iam-staging.sdkwork.cn
        tls: sdkwork.cn
        mode: api
        web: adaptive
      - domain: iam-staging.birdcoder.cn
        tls: birdcoder.cn
        mode: api
        web: adaptive
      - domain: iam-staging.dtupay.cn
        tls: dtupay.cn
        mode: api
        web: adaptive
      - domain: iam-staging.skubc.com
        tls: skubc.com
        mode: api
        web: adaptive
      - domain: iam-staging.skubc.cn
        tls: skubc.cn
        mode: api
        web: adaptive
      - domain: iam-staging.zowalk.com
        tls: zowalk.com
        mode: api
        web: adaptive
      - domain: iam-staging.zowalk.cn
        tls: zowalk.cn
        mode: api
        web: adaptive
      - domain: iam-staging.offer86.com
        tls: offer86.com
        mode: api
        web: adaptive
      - domain: iam-staging.offer86.cn
        tls: offer86.cn
        mode: api
        web: adaptive
      - domain: iam-staging.86offer.com
        tls: 86offer.com
        mode: api
        web: adaptive
      - domain: iam-staging.86offer.cn
        tls: 86offer.cn
        mode: api
        web: adaptive
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.staging
        env: etc/topology/cloud.staging.env
      kubernetes:
        reference: deployments/kubernetes/
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: iam.sdkwork.com
        tls: sdkwork.com
        mode: api
        web: adaptive
      - domain: iam.birdcoder.com
        tls: birdcoder.com
        mode: api
        web: adaptive
      - domain: iam.dtupay.com
        tls: dtupay.com
        mode: api
        web: adaptive
      - domain: iam.sdkwork.cn
        tls: sdkwork.cn
        mode: api
        web: adaptive
      - domain: iam.birdcoder.cn
        tls: birdcoder.cn
        mode: api
        web: adaptive
      - domain: iam.dtupay.cn
        tls: dtupay.cn
        mode: api
        web: adaptive
      - domain: iam.skubc.com
        tls: skubc.com
        mode: api
        web: adaptive
      - domain: iam.skubc.cn
        tls: skubc.cn
        mode: api
        web: adaptive
      - domain: iam.zowalk.com
        tls: zowalk.com
        mode: api
        web: adaptive
      - domain: iam.zowalk.cn
        tls: zowalk.cn
        mode: api
        web: adaptive
      - domain: iam.offer86.com
        tls: offer86.com
        mode: api
        web: adaptive
      - domain: iam.offer86.cn
        tls: offer86.cn
        mode: api
        web: adaptive
      - domain: iam.86offer.com
        tls: 86offer.com
        mode: api
        web: adaptive
      - domain: iam.86offer.cn
        tls: 86offer.cn
        mode: api
        web: adaptive
    packages:
      - id: sdkwork-api-iam-assembly
        kind: rust-binary
        crate: sdkwork-api-iam-assembly
        healthPath: /healthz
        readinessPath: /readyz
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/
      proxy:
        upstreams:
          application: http://127.0.0.1:8080
  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - domain: iam.sdkwork.com
        tls: sdkwork.com
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.birdcoder.com
        tls: birdcoder.com
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.dtupay.com
        tls: dtupay.com
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.sdkwork.cn
        tls: sdkwork.cn
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.birdcoder.cn
        tls: birdcoder.cn
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.dtupay.cn
        tls: dtupay.cn
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.skubc.com
        tls: skubc.com
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.skubc.cn
        tls: skubc.cn
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.zowalk.com
        tls: zowalk.com
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.zowalk.cn
        tls: zowalk.cn
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.offer86.com
        tls: offer86.com
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.offer86.cn
        tls: offer86.cn
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.86offer.com
        tls: 86offer.com
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
      - domain: iam.86offer.cn
        tls: 86offer.cn
        mode: api
        web: adaptive
        apiPathStyle: full-prefix
    packages:
      - id: sdkwork-api-iam-assembly
        kind: rust-binary
        crate: sdkwork-api-iam-assembly
        healthPath: /healthz
        readinessPath: /readyz
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:3901
          platform.api-gateway: http://127.0.0.1:3900
      nginx:
        clientMaxBodySize: 32m
