# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/iam/webserver.pid;
error_log /var/log/sdkwork/iam/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3901;
    }
    server {
        listen 80;
        server_name iam-dev.sdkwork.com iam-dev.birdcoder.com iam-dev.dtupay.com iam-dev.sdkwork.cn iam-dev.birdcoder.cn iam-dev.dtupay.cn iam-dev.skubc.com iam-dev.skubc.cn iam-dev.zowalk.com iam-dev.zowalk.cn iam-dev.offer86.com iam-dev.offer86.cn iam-dev.86offer.com iam-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
