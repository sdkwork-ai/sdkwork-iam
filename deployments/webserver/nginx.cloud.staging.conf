# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/iam/webserver.pid;
error_log /var/log/sdkwork/iam/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name iam-staging.sdkwork.com iam-staging.birdcoder.com iam-staging.dtupay.com iam-staging.sdkwork.cn iam-staging.birdcoder.cn iam-staging.dtupay.cn iam-staging.skubc.com iam-staging.skubc.cn iam-staging.zowalk.com iam-staging.zowalk.cn iam-staging.offer86.com iam-staging.offer86.cn iam-staging.86offer.com iam-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
