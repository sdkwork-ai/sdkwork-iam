name: sdkwork_iam_flutter_mobile_user_center
description: SDKWork IAM Flutter Mobile User Center capability.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sdkwork_iam_flutter_mobile_core:
    path: ../sdkwork_iam_flutter_mobile_core
  sdkwork_iam_flutter_mobile_commons:
    path: ../sdkwork_iam_flutter_mobile_commons

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/src/i18n/en-US/iam/user_center/
    - lib/src/i18n/zh-CN/iam/user_center/
