name: sdkwork_iam_flutter_mobile_console_cloud_account
description: SDKWork IAM Flutter Mobile Console Cloud Account capability.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sdkwork_iam_flutter_mobile_console_core:
    path: ../sdkwork_iam_flutter_mobile_console_core
  sdkwork_iam_flutter_mobile_commons:
    path: ../sdkwork_iam_flutter_mobile_commons

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/src/i18n/en-US/iam/console_cloud_account/
    - lib/src/i18n/zh-CN/iam/console_cloud_account/
