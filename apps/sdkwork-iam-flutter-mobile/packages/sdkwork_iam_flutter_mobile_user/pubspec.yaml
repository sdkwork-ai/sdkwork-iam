name: sdkwork_iam_flutter_mobile_user

description: IAM Flutter mobile user-center profile controller and route manifest.

version: 0.1.0

publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  sdkwork_iam_flutter_mobile_core:
    path: ../sdkwork_iam_flutter_mobile_core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sdkwork_iam_flutter_mobile_commons:
    path: ../sdkwork_iam_flutter_mobile_commons

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - lib/src/i18n/en-US/iam/user/
    - lib/src/i18n/zh-CN/iam/user/
