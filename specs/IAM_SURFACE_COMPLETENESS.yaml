schemaVersion: 1
kind: sdkwork.iam.surface.completeness
standardVersion: 2026-06-29
purpose: >
  Living completeness matrix for sdkwork-iam across database, API, SDK, and client
  surfaces. Status values: complete, partial, scaffold, missing.

ratingScale:
  complete: End-to-end wired with operator/user UI where applicable and tests
  partial: Backend or controller exists; UI or cross-surface parity incomplete
  scaffold: Composition/contracts only; no capability UI
  missing: Not started or intentionally out of scope for the surface

database:
  status: complete
  tables: 61
  baseline: database/ddl/baseline/postgres/0001_iam_baseline.sql
  migrations: database/migrations/postgres/

api:
  backend-api:
    status: complete
    authority: apis/backend-api/iam/sdkwork-iam-backend-api.openapi.yaml
    router: crates/sdkwork-routes-iam-backend-api/
    postgresIntegrationTests: crates/sdkwork-routes-iam-backend-api/tests/iam_backend_postgres_integration.rs
    authenticatedRoundtrip: backend_postgres_authenticated_user_list_roundtrip
  app-api:
    status: complete
    authority: apis/app-api/iam/sdkwork-iam-app-api.openapi.yaml
    router: crates/sdkwork-routes-iam-app-api/
    postgresIntegrationTests:
      - crates/sdkwork-routes-iam-app-api/tests/iam_local_app_router_test.rs
      - crates/sdkwork-routes-iam-app-api/tests/oauth_authorization_server_integration.rs
  open-api:
    status: complete
    scope: oauth-authorization-server
    authority: apis/open-api/iam/sdkwork-iam-open-api.openapi.yaml

sdks:
  typescript:
    app: complete
    backend: complete
    open: complete
  otherLanguages:
    status: partial
    note: TypeScript generated SDKs are composed and verified; Dart/Swift artifacts are generated transport outputs and still require composed consumer verification before GA.

capabilities:
  - id: auth-session
    database: complete
    backend-api: missing-by-design
    app-api: complete
    open-api: partial
    pc-app: complete
    pc-admin: n/a
    pc-console: n/a
    h5-app: partial
    flutter-app: partial

  - id: tenant
    database: complete
    backend-api: complete
    app-api: missing-by-design
    pc-app: partial
    pc-admin: complete
    pc-console: complete
    h5-app: partial
    flutter-app: missing
    notes: >
      H5 ships the `app.iam.tenant.overview` screen (/tenant) over the app-api
      read ports — session context, organizations and memberships, each with
      server-side search and paging, zh-CN/en-US copy and a screen test. Tenant
      administration (create/update/members) stays PC-admin only because
      `iam.tenants.*` is a backend-api resource.

  - id: organization
    database: complete
    backend-api: complete
    app-api: partial
    pc-app: partial
    pc-admin: complete
    pc-console: complete
    h5-app: complete
    flutter-app: missing
    notes: >
      H5 ships the `app.iam.organization.directory` screen (/organizations) over
      the app-api `organizations.list` read port, with server-side search and
      paging. The app tier is read-only by design: create/update/delete stay on
      the PC admin surface because they are backend-api resources.

  - id: permission
    database: complete
    backend-api: complete
    app-api: partial
    pc-app: missing
    pc-admin: complete
    pc-console: missing-by-design
    h5-app: missing
    flutter-app: missing

  - id: oauth
    database: complete
    backend-api: complete
    app-api: partial
    open-api: complete
    pc-app: complete
    pc-admin: complete
    pc-console: missing-by-design
    h5-app: complete
    flutter-app: partial

    notes: >
      WeChat mini-program login now has a dedicated jscode2session exchange and
      typed command, but H5/Flutter consumers and live provider credentials still
      require release acceptance. WeChat official-account XML/AES callbacks are
      implemented at the open-api adapter boundary. H5 also ships
      `/oauth/providers`: the provider catalog is paged and searched on the
      server, and starting a flow mints the authorization URL through the
      controller and hands it to the host, which owns navigation and the
      in-app-browser/deep-link decision.

  - id: user-directory
    database: complete
    backend-api: complete
    app-api: partial
    pc-app: partial
    pc-admin: complete
    pc-console: missing-by-design
    h5-app: missing
    flutter-app: missing

  - id: account-binding
    database: partial
    backend-api: complete
    app-api: complete
    pc-app: partial
    pc-admin: complete
    pc-console: complete
    h5-app: complete
    flutter-app: partial
    notes: >
      H5 ships `/user/account-binding`: the tenant policy is rendered as the first
      region and gates the rest of the screen, email bind/unbind goes through the
      app-api current-user bindings, and linked third-party identities can be
      unlinked after an in-place confirmation. Phone binding stays PC-console only.

  - id: user-center
    database: complete
    backend-api: complete
    app-api: partial
    pc-app: complete
    pc-admin: missing-by-design
    pc-console: complete
    h5-app: partial
    flutter-app: partial
    notes: >
      H5 now ships both self-service screens as addressable routes
      (`/user/profile`, `/user/password`) over the app-api current-user ports,
      with edit, verification-policy hinting, localized copy and tests. Avatar
      upload and local preferences remain PC app-only.

clientSurfaces:
  parityAuthority: scripts/lib/client-app-surfaces/model.mjs (ROUTES — 26 capability screens across the app, console and admin tiers)
  nativeDelivery:
    ios: >
      Delivered by apps/sdkwork-iam-flutter-mobile (publishPlatforms: APP_IOS,
      bundleName com.sdkwork.iam.mobile). The repository has no separate Swift
      application root, and the workspace has no sibling iOS app root.
    android: >
      Delivered by apps/sdkwork-iam-flutter-mobile (publishPlatforms: APP_ANDROID,
      packageName com.sdkwork.iam.mobile).
    harmony: apps/sdkwork-iam-harmony-mobile (native ArkTS, APP_HARMONY)
  h5:
    status: partial
    shell: >
      Implemented: history router, route table, guard presentation, bottom tab bar,
      not-found state, application-chrome catalog (zh-CN/en-US).
    runtime: >
      Implemented: generated app SDK client -> SdkworkIamService composition in
      @sdkwork/iam-h5-core, with a session store subscription that pushes the
      bearer token onto the client on sign-in and clears it on sign-out.
    implementedScreens:
      - app.iam.auth.login
      - app.iam.auth.register
      - app.iam.auth.forgot-password
      - app.iam.auth.oauth-callback
      - app.iam.tenant.overview
      - app.iam.organization.directory
      - app.iam.account-binding.list
      - app.iam.user-center.profile
      - app.iam.user-center.password
      - app.iam.oauth.providers
      - console.iam.tenant.overview
      - console.iam.organization.directory
      - console.iam.account-binding.list
      - console.iam.user-center.profile
    partialScreens:
      app.iam.auth.context-selection: >
        The screen exists and is driven by a login challenge, which only exists
        after a sign-in call; it is a step in the login flow rather than a URL a
        user can land on. PC records the same shape as `partial`.
    scaffoldScreens:
      - admin.iam.oauth.providers
      - admin.iam.permission.authorizations
      - admin.iam.account-binding.list
      - admin.iam.user.list
    adminNote: >
      The admin tier has started. `h5-admin-core` now builds a real generated
      backend-client boundary (`createIamH5AdminBackendAdminSdkClient`) instead of the
      marker object that carried only a base URL, and `createIamH5AdminService`
      aggregates it with the app client through the shared IAM service — which is why
      backend-admin resources such as `iam.permissions` are readable at all.
      `admin.iam.permission.permissions` is the first real admin screen: the tenant's
      permission catalog, server-searched and server-paged, dropping records without an
      identity. It is joined by the role and policy catalogs (a role falls back to its
      code when it has no display name; a policy shows its allow/deny effect on the row,
      because the two are otherwise indistinguishable) and by the audit trail, which leads
      each row with the action and actor a ticket names and keeps the resource and time as
      the way to narrow a search. The tenant list completes the deployment view: every
      tenant with its status on the row, so a suspended tenant cannot look active. The
      organization tree flattens the hierarchy with a depth, so indentation is the nesting
      and a node without an identity takes its subtree with it rather than promoting
      children to roots. H5 now matches the PC count. The remaining four admin screens
      reuse the same controller shape; `permission.authorizations` and `user.list` stay
      blocked because the IAM service exposes no list operation for either.
      The admin credential is the one session token read at request time; the backend
      enforces the admin permission itself, and a separate backend-admin credential
      issuance flow is still an open governance item.
    consoleNote: >
      The console tier is complete: the tenant workspace (identity, self-service policy,
      organizations), the tenant-wide organization list (server searched and paged,
      parent id kept so an operator can reconstruct the tree), the account-binding
      workspace (linked identities plus the policy that gates removal, with a
      not-allowed policy reported rather than hidden), and the user-center profile (the
      operator's own record plus the tenant verification policy — the question behind
      most verification tickets). The admin tier remains scaffolded and additionally
      needs the backend client wired into `sdkwork-iam-h5-admin-core`.
    blockedScreens:
      app.iam.user.list: >
        app-api publishes no user-directory read operation; the only directory list
        is a backend-api resource, which a mobile app surface may not consume.
        Recorded in specs/IAM_CLIENT_PARITY.json as `blockedBy`.
  miniProgram:
    status: partial
    note: >
      Build chain repaired: `scripts/build-runtime.mjs` bundles
      `src/bootstrap/runtimeBundle.ts` with esbuild into a self-contained
      `src/runtime/iam-app.js` and derives `src/app.json` from the route registry
      intersected with `IAM_MP_IMPLEMENTED_ROUTE_IDS`, failing the build when a
      projected page has no files. The manifest previously declared 26 pages and
      shipped none; it now declares exactly the pages that exist.
      Shipped pages: login (password sign-in), register, forgot-password (all three
      through the runtime's auth port), the `app-tenant` subpackage tenant overview
      (session context, organizations, memberships), the `app-organization`
      subpackage directory (server-searched, append-on-load-more, stale-response
      guard), and the `app-user-center` subpackage — profile and password. The profile
      page reads `iam/users/current` and saves only the fields the user edited, because
      an untouched empty field would clear a value the backend holds, and it refuses an
      all-empty save rather than sending a request the server can only reject. The
      password page applies the same rules and order as the H5 and PC forms before the
      request and clears all three fields on success.
      The `app-account-binding` subpackage lists linked identities and the tenant
      policy; the removal action exists only when the tenant grants self-service
      unlink, and a row disappears only after the server accepts the removal.
      21 node tests cover the registry, the manifest/files invariant and the runtime
      ports.
      Remaining: 18 declared routes still need pages — provider list, oauth-callback
      and context-selection first, then the console and admin tiers.
  flutter:
    status: partial
    note: >
      The root now compiles and renders. Repaired this round: `app.dart` and the
      shell referenced a non-existent `IamFlutterMobileShell`; `bootstrap/runtime.dart`
      called a top-level `createIamRuntime` that does not exist; `IamSdkClientFactory`
      lacked the `clientClass` getter its three interfaces require; the auth package
      emitted three invalid Dart identifiers from hyphenated route screens
      (`forgot-passwordRouteId`, …); and two barrels exported a class twice, which is
      a compile error. The shell now loads the tenant `.arb` fragment through
      `packages/<package>/…`, mounts the tenant screen as home and registers `/tenant`
      in its route table.
      One capability is real end to end: `sdkwork_iam_flutter_mobile_tenant` (data
      port, controller, screen with loading/ready/error/empty) plus the app-api
      adapter `IamTenantAppSdkDataSource`. 8 app tests + 7 package tests pass;
      `dart analyze lib test` reports no errors.
      Auth is now the gate: `sdkwork_iam_flutter_mobile_auth` has a data port, a
      controller that records the session, and a sign-in screen; the shell shows it
      whenever no session exists and swaps to the tenant screen once one does.
      `IamAuthAppSdkDataSource` performs the sign-in through the generated client and
      writes the token manager (so every tier client picks the token up) and clears
      the session on sign-out.
      Known drift: the generated Dart `AppbaseSessionCreateCommand` carries no
      `grantType` (the TypeScript client sends an explicit one), and the Dart
      `SdkworkAppClient` exposes flat `organizationsList` methods rather than the
      TypeScript namespaces. Both are generator-profile differences to reconcile
      before GA.
      Remaining: 18 capability packages still hold the generated stub, and the
      registration screen is blocked: the generated Dart app SDK has no
      verification-code operation, so a Flutter sign-up form cannot request the code
      it must submit (the H5 form sidesteps this by taking an injected code client).
      Eight real capabilities now: tenant, organization, account-binding, user-center
      (profile + password), auth (sign-in + password reset), oauth (provider list, a real
      authorization URL, and the browser hand-off) and the whole console tier — tenant,
      organization, account-binding and user-center. The console tenant workspace reads the
      same resources as the app tenant screen plus the binding policy the app screen never
      shows; the console organization directory lists every organization of the tenant,
      keeping the parent id; the console account-binding workspace reports a not-allowed
      policy instead of hiding the removal button; the console user-center profile pairs the
      operator's record with the tenant verification policy. The root also
      gained its second platform adapter — `IamUrlOpenerAdapter` over `url_launcher` — so the
      provider screen opens a browser instead of reporting that it cannot, and a failed open
      is reported rather than swallowed. `SdkworkHostCapability` has no constant for "open an
      external URL", so the key lives in the adapter and is recorded here as a core gap
      (reusing `deepLinks` would have been wrong: that capability is for receiving links).
      The admin tier has started on Flutter too: the root already builds a generated
      `SdkworkBackendClient` per tier, so `admin.iam.permission.permissions` reads the
      backend-api permission catalog through a port and never sees a transport. The
      remaining nine admin screens reuse that shape.
  harmony:
    status: scaffold
    note: Route/page map exists; capability pages do not render real data yet.

priorityBacklog:
  p0: []
  p1:
    - PC app-side naming migration (sdkwork-iam-pc-auth, sdkwork-iam-pc-user-center targets)
    - Wire sendVerifyCode through iam-service when app-api verification endpoints are materialized
    - >
      Route model gap: PC ships a cloud-account console page
      (`sdkwork-iam-pc-console-cloud-account`) and every client root carries
      cloud-account packages, but `scripts/lib/client-app-surfaces/model.mjs`
      declares no cloud-account route. Two mini-program capability specs claimed
      `admin.iam.cloud-account.list` / `console.iam.cloud-account.list`, which the
      registry does not contain, so the ids were removed to keep the contract
      honest. Decide the model change (add the capability) before re-declaring
      them; declaring a route first is what produced the mismatch.
  p2:
    - Multi-language SDK materialization
    - Dedicated iam_account_binding tables vs iam_policy composition

verification:
  - pnpm run verify
  - pnpm run test:iam-standard-contracts
  - cargo test --workspace
  - node ../sdkwork-specs/tools/check-api-operation-patterns.mjs --workspace .
  - node ../sdkwork-specs/tools/check-app-sdk-consumer-imports.mjs --workspace .
